site_name: Nukleáris Energiavölgy 3D
site_description: >-
  Nukleáris energiavölgy és magstabilitási felület 3D WebGL vizualizáció és többnyelvű dokumentáció az IAEA AME2020 adatai alapján.
site_url: https://lowcoders.github.io/nuclear_valley/

copyright: >-
  Nukleáris Energiavölgy 3D &nbsp;&middot;&nbsp;
  <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.hu">CC BY-SA 4.0</a>
  &nbsp;&middot;&nbsp;
  <a href="/nuclear_valley/app/">⚛️ 3D Szimulátor</a>

docs_dir: docs
site_dir: site

hooks:
  - docs/hooks.py

theme:
  name: material
  language: hu
  features:
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Vissza a világos oldalra
    - scheme: default
      primary: cyan
      accent: amber
      toggle:
        icon: material/weather-night
        name: Át a sötét oldalra

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax-config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - hu
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: hu
          default: true
          name: Magyar
          build: true
          site_name: Nukleáris Energiavölgy 3D
        - locale: en
          name: English
          build: true
          site_name: Nuclear Energy Valley 3D
          nav_translations:
            Kezdőlap: Home
            "Fizikai Háttér": "Physical Background"
            "Használati Útmutató": "User Guide"
            "Adatbázis & Architektúra": "Database & Architecture"
            "⚛️ 3D Szimulátor": "⚛️ 3D Simulator"

nav:
  - Kezdőlap: index.md
  - "Fizikai Háttér": physics.md
  - "Használati Útmutató": guide.md
  - "Adatbázis & Architektúra": database.md
  - "⚛️ 3D Szimulátor": /nuclear_valley/app/
